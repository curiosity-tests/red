name: Linux-x86
run-name: "Linux-x86 ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  Linux-Red-Tests:
    runs-on: ubuntu-latest
    name: Run Linux-x86 Tests
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Build Tests
      uses: ./CI/Linux-gtk
      with:
        command: /sbin/start-stop-daemon --start --quiet --background --exec /usr/bin/Xvfb && sleep 3 && rebol -qws tests/run-all.r --batch

    # upload log file if any test failed
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Linux-Red-Tests-log
        path: quick-test/quick-test.log

  Linux-RS-Tests:
    runs-on: ubuntu-latest
    name: Run Linux-RS Tests
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Build Tests
      uses: ./CI/Linux-32
      with:
        command: rebol -qws system/tests/run-all.r --batch

    # upload log file if any test failed
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Linux-RS-Tests-log
        path: quick-test/quick-test.log
